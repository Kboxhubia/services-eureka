name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate repository structure
      run: |
        echo "Validating MetaDoinGO repository structure..."
        ls -la
        test -f README.md && echo "✓ README.md exists" || exit 1
        test -f LICENSE && echo "✓ LICENSE exists" || exit 1

    - name: Check documentation integrity
      run: |
        echo "Checking documentation files..."
        wc -l README.md
        grep -q "MetaDoinGO" README.md && echo "✓ README contains MetaDoinGO content" || exit 1
